name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json (version + release URLs)
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          node - "$REPO" "$VERSION" "$TAG" <<'EOF'
          const fs = require('fs');
          const [repo, version, tag] = process.argv.slice(2);
          const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          m.version = version;
          m.url = `https://github.com/${repo}`;
          m.manifest = `https://github.com/${repo}/releases/latest/download/module.json`;
          m.download = `https://github.com/${repo}/releases/download/${tag}/module.zip`;
          fs.writeFileSync('module.json', JSON.stringify(m, null, '\t') + '\n');
          EOF

      - name: Package
        run: |
          zip -r module.zip \
            module.json \
            dist \
            styles \
            templates \
            lang \
            assets \
            README.md \
            CHANGELOG.md \
            LICENSE

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
